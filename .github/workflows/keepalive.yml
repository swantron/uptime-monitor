name: Keepalive

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Re-enable monitor workflow if disabled
        run: gh workflow enable monitor.yml || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
